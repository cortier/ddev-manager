name: Validate
on:
    push:
    pull_request:
permissions:
    contents: read
jobs:
    extension:
        runs-on: blacksmith-2vcpu-ubuntu-2404
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v7.0.0
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm test
            - run: npm run build
            - run: npm run lint:extension
            - run: npx playwright install --with-deps firefox
            - run: npm run test:ui
    companion:
        strategy:
            matrix:
                os: [blacksmith-2vcpu-ubuntu-2404, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-go@v7.0.0
              with:
                  go-version-file: companion/go.mod
                  cache-dependency-path: companion/go.sum
            - run: go test -race ./...
              working-directory: companion
            - run: go vet ./...
              working-directory: companion
